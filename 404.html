<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Page Not Found | LN Photogrammetry</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090d;--surface:#0d1117;--ink:#e8edf5;--muted:#7a8499;
  --accent:#c8d8f0;--accent-ink:#07090d;--border:rgba(255,255,255,.08);
}
html[data-theme="light"]{
  --bg:#f4f6f9;--surface:#ffffff;--ink:#10141c;--muted:#5b6472;
  --accent:#2d4b86;--accent-ink:#ffffff;--border:rgba(10,14,20,.09);
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:'Barlow',sans-serif;
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:20px;
}
.wrap{max-width:480px}
img{height:44px;margin-bottom:32px;opacity:.9}
.code{
  font-family:'Barlow Condensed',sans-serif;font-size:110px;font-weight:800;
  color:var(--accent);line-height:1;margin-bottom:8px;
}
h1{font-family:'Barlow Condensed',sans-serif;font-size:26px;text-transform:uppercase;font-weight:700;margin-bottom:14px}
p{color:var(--muted);font-size:15.5px;line-height:1.6;margin-bottom:32px}
a.btn{
  display:inline-block;padding:14px 32px;border-radius:4px;
  background:var(--accent);color:var(--accent-ink);text-decoration:none;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;
}
.phone{margin-top:24px;font-size:13.5px;color:var(--muted)}
.phone a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <img src="logo-mark.png" alt="LN Photogrammetry" id="logoImg">
  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p>That page doesn't exist, or the link's out of date. The 3D models are all still on the homepage.</p>
  <a class="btn" href="index.html">Back to Homepage</a>
  <p class="phone">Or call/text <a href="tel:4074879843">(407) 487-9843</a> directly.</p>
</div>
<script>
(function(){
  var t = localStorage.getItem('ln-theme');
  if(t === 'light' || t === 'dark'){ document.documentElement.setAttribute('data-theme', t); }
  if(t === 'light'){ document.getElementById('logoImg').src = 'logo-mark-dark.png'; }
})();
</script>
</body>
</html>
